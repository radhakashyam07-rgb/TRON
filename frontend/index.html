<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRON P-01</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .status {
            font-size: 12px;
            color: #aaa;
        }

        .hero {
            text-align: center;
            margin-top: 90px;
        }

        .hero h1 {
            font-size: 64px;
            letter-spacing: 15px;
            margin: 0;
        }

        .hero p {
            color: #999;
            margin-top: 15px;
        }

        .search-box {
            margin: 40px auto 20px;
            display: flex;
            max-width: 700px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid #555;
            background: #181818;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #252525;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #output {
            max-width: 700px;
            margin: 35px auto;
            padding: 20px;
            min-height: 100px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #0d0d0d;
            white-space: normal;
        }

        .result {
            padding: 15px 0;
            border-bottom: 1px solid #292929;
        }

        .result:last-child {
            border-bottom: none;
        }

        .result-title {
            font-size: 18px;
            font-weight: bold;
        }

        .result-url {
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .result-content {
            color: #bbb;
            margin-top: 8px;
            line-height: 1.5;
        }

        .sara-answer {
            line-height: 1.6;
            color: #ddd;
        }

        .error {
            color: #ff7777;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 80px;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">TRON</div>
        <div class="status">P-01 • PRIVATE CORE</div>
    </header>


    <main class="hero">

        <h1>TRON</h1>

        <p>
            Search. Understand. Create.
        </p>


        <div class="search-box">

            <input
                id="query"
                type="text"
                placeholder="Ask TRON or search..."
                autocomplete="off"
            >

            <button onclick="tronSearch()">
                Search
            </button>

        </div>


        <div class="actions">

            <button onclick="openSARA()">
                Ask SARA
            </button>

        </div>


        <div id="output">
            TRON Core ready.
        </div>

    </main>


    <footer>
        TRON P-01 • SARA AI Core
    </footer>

</div>


<script>

const API = "http://127.0.0.1:8080";


function getQuery() {

    return document
        .getElementById("query")
        .value
        .trim();

}


/* -------------------------
   TRON SEARCH
------------------------- */

async function tronSearch() {

    const query = getQuery();

    const output =
        document.getElementById("output");


    if (!query) {

        output.innerHTML =
            "Enter something to search.";

        return;
    }


    output.innerHTML =
        "TRON is searching...";


    try {

        const response = await fetch(
            API + "/api/search",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    query: query
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            output.innerHTML =
                `<div class="error">
                    ${escapeHTML(data.error)}
                </div>`;

            return;
        }


        if (!data.results ||
            data.results.length === 0) {

            output.innerHTML =
                "No TRON results found.";

            return;
        }


        output.innerHTML =
            data.results
                .map(result => `

                    <div class="result">

                        <div class="result-title">
                            ${escapeHTML(result.title)}
                        </div>

                        <div class="result-url">
                            ${escapeHTML(result.url)}
                        </div>

                        <div class="result-content">
                            ${escapeHTML(result.content)}
                        </div>

                    </div>

                `)
                .join("");

    }

    catch (error) {

        output.innerHTML = `
            <div class="error">
                TRON Core is not reachable.
                <br><br>
                Start the TRON backend server first.
            </div>
        `;

    }

}


/* -------------------------
   SARA
------------------------- */

async function openSARA() {

    const message = getQuery();

    const output =
        document.getElementById("output");


    if (!message) {

        output.innerHTML =
            "Type a message for SARA first.";

        return;
    }


    output.innerHTML =
        "SARA is thinking...";


    try {

        const response = await fetch(
            API + "/api/sara",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            output.innerHTML =
                `<div class="error">
                    ${escapeHTML(data.error)}
                </div>`;

            return;
        }


        output.innerHTML = `
            <div class="sara-answer">

                <strong>SARA</strong>

                <br><br>

                ${escapeHTML(data.answer)}

            </div>
        `;

    }

    catch (error) {

        output.innerHTML = `
            <div class="error">
                SARA Core is not reachable.
                <br><br>
                Start the TRON backend server first.
            </div>
        `;

    }

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* -------------------------
   ENTER KEY
------------------------- */

document
    .getElementById("query")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                tronSearch();

            }

        }
    );

</script>

</body>
    </html>
